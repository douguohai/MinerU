# =============================================================================
# 通过 GitHub Actions 构建 MinerU Docker 镜像（linux/amd64，x86_64）
#
# - 构建阶段把所需模型全部下载并打进镜像（运行时不再联网下载）。
#   CPU 版打包 pipeline 模型；GPU 版打包 pipeline + VLM 全部模型。
# - 产物推送到 GHCR：ghcr.io/<你的用户名或组织>/mineru:cpu 和 :gpu
#
# 手动触发：仓库 Actions 页 -> "build-docker-images" -> Run workflow。
#
# 离线部署流程（在有网的一台机器上执行一次）：
#   docker pull ghcr.io/<owner>/mineru:cpu
#   docker pull ghcr.io/<owner>/mineru:gpu
#   docker save ghcr.io/<owner>/mineru:cpu -o mineru-cpu.tar
#   docker save ghcr.io/<owner>/mineru:gpu -o mineru-gpu.tar
#   把 tar 拷到离线机器后：docker load -i mineru-gpu.tar
# =============================================================================
name: build-docker-images

on:
  workflow_dispatch:
    inputs:
      vllm_image:
        description: 'GPU 基础镜像（按宿主 NVIDIA 驱动版本选择）'
        required: true
        type: choice
        default: 'vllm/vllm-openai:v0.21.0-cu129'
        options:
          - 'vllm/vllm-openai:v0.21.0-cu129'   # CUDA 12.9，驱动 >= 575.51（默认）
          - 'vllm/vllm-openai:v0.21.0'        # CUDA 13.0，驱动 >= 580.88
          - 'vllm/vllm-openai:v0.11.0'        # CUDA 12.8，驱动 >= 570.86（低 CUDA）
          - 'vllm/vllm-openai:v0.10.1.1'      # CUDA 12.8，驱动 >= 570.86（MinerU 最低 vLLM）

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/mineru

jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push CPU image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/cpu/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:cpu

  gpu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GPU 镜像很大（vllm 基础镜像 + 全部模型），默认 14GB 磁盘可能不够，先清理释放空间
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push GPU image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/gpu/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            VLLM_IMAGE=${{ github.event.inputs.vllm_image || 'vllm/vllm-openai:v0.21.0-cu129' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:gpu
